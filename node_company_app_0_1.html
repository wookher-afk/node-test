<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE · 사람·장비 구하기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#19283a;font-family:system-ui,-apple-system,sans-serif}main{max-width:470px;margin:auto;min-height:100vh;background:white;padding-bottom:84px}header{padding:24px 20px 12px}h1{font-size:30px;margin:0}header p{margin:4px 0;color:#65748a}section{padding:0 18px}h2{font-size:22px;margin:15px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#eaf0f7;padding:13px 15px;font-weight:700;color:#1b344f;cursor:pointer}button.primary{background:#145eae;color:white}button.full{width:100%}input,select,textarea{border:1px solid #d3deea;border-radius:10px;padding:12px;width:100%;background:#fff}label{display:block;font-size:13px;color:#526379;margin:15px 0 6px}.hint{background:#eff5fc;color:#416287;padding:12px;border-radius:11px;font-size:13px;line-height:1.5;margin:10px 0 16px}.card{border:1px solid #dfe7f0;border-radius:15px;padding:16px;margin:12px 0}.card h3{margin:7px 0;font-size:19px}.muted{color:#64748a;font-size:13px;line-height:1.7}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.tag{display:inline-block;background:#e8f3ed;color:#13764a;padding:4px 10px;border-radius:30px;font-size:12px}.big{font-size:23px;font-weight:750;margin:9px 0}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;display:flex;background:white;border-top:1px solid #e0e7ef;padding:9px;gap:7px}.bottom button{flex:1;background:white;padding:8px 4px;font-size:13px}.bottom button.active{color:#145eae;background:#eaf3ff}.empty{text-align:center;color:#7b8998;padding:30px 10px}.status{background:#f0f5fb;border-radius:10px;padding:12px;margin-top:12px;font-size:14px}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#192f49;color:white;border-radius:12px;padding:12px 17px;max-width:90%;z-index:5}textarea{resize:vertical;min-height:72px}
</style></head><body><main><header><h1>NODE</h1><p>필요한 사람과 장비, 간편하게 구하세요.</p></header><section><div class="hint">실제 구인·계약이 이루어지지 않는 <b>체험용 앱</b>입니다. 가상 인력과 현장만 표시되며 개인정보를 입력하지 마세요.</div>
<div id="home"><h2>어떤 작업을 원하세요?</h2><button class="primary full" id="start">＋ 새 구인 등록</button><h2>내 구인 현황</h2><div id="postList"></div></div>
<div id="create" class="hidden"><button id="back" type="button">← 돌아가기</button><h2>현장 작업 등록</h2><form id="jobForm"><label for="site">현장 이름</label><input id="site" maxlength="50" placeholder="예: 달성군 상수관로 공사" required><label for="region">시·도 (전국)</label><select id="region"><option>서울특별시</option><option>부산광역시</option><option>대구광역시</option><option>인천광역시</option><option>광주광역시</option><option>대전광역시</option><option>울산광역시</option><option>세종특별자치시</option><option>경기도</option><option>강원특별자치도</option><option>충청북도</option><option>충청남도</option><option>전북특별자치도</option><option>전라남도</option><option>경상북도</option><option>경상남도</option><option>제주특별자치도</option></select><label for="district">시·군·구</label><input id="district" maxlength="50" placeholder="예: 달성군 / 합천군" required><label for="town">읍·면·동 또는 현장 주소 (선택)</label><input id="town" maxlength="80" placeholder="예: 가야면"><h3>모집 요강</h3><p class="muted">한 현장에 여러 직종·장비를 + 버튼으로 추가하세요.</p><div id="requirements"></div><button id="addRequirement" type="button" class="full">＋ 모집 요강 추가</button><div class="row"><div><label for="date">시작일</label><input id="date" type="date" required></div><div><label for="endDate">종료일</label><input id="endDate" type="date" required></div></div><label for="visibility">공개 범위</label><select id="visibility"><option>전체 공개</option><option>지정 작업자 공개</option><option>비공개 직접 제안</option></select><label for="deadline">지원 마감일</label><input id="deadline" type="date"><label><input type="checkbox" id="partial" style="width:auto" checked> 일부 날짜 지원 허용</label><label><input type="checkbox" id="urgent" style="width:auto"> 긴급 구인</label><label for="meal">식사</label><select id="meal"><option>제공</option><option>미제공</option><option>협의</option></select><label for="lodging">숙박</label><select id="lodging"><option>미제공</option><option>제공</option><option>협의</option></select><label for="transportCost">이동·운송비</label><select id="transportCost"><option>별도 협의</option><option>업체 부담</option><option>작업자 부담</option></select><label for="memo">추가 조건 (선택)</label><textarea id="memo" maxlength="180" placeholder="예: 오전 8시 시작, 숙식 제공"></textarea><div style="height:15px"></div><button class="primary full" type="submit">구인 등록하기</button></form></div>
<div id="detail" class="hidden"><button id="detailBack">← 구인 현황</button><div id="detailContent"></div></div>
<div id="applicants" class="hidden"><button id="applicantBack">← 구인 현황</button><h2>지원자 확인</h2><div id="applicantContent"></div></div>
<div id="company" class="hidden"><h2>내 업체</h2><div class="card"><b>NODE 체험 업체</b><p class="muted">실제 업체 등록·사업자 인증은 연결되지 않았습니다.</p></div><button id="reset" class="full">체험 기록 초기화</button></div>
</section><nav class="bottom"><button data-tab="home" class="active">⌂<div>구인 현황</div></button><button data-tab="create">＋<div>구인 등록</div></button><button data-tab="company">♙<div>내 업체</div></button></nav></main><div id="toast" class="hidden" role="status"></div>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),key='node-company-app-v2';
let posts=[];try{const p=JSON.parse(localStorage.getItem(key));if(Array.isArray(p))posts=p}catch(e){}
let selected=null;
const categories={
'토목·기반시설':['굴착기 작업','상하수도 배관','토공·정지','포장·도로','측량','흙막이·가시설','구조물·철근콘크리트','조경·석공','기타 토목'],
'건축·마감':['형틀목공','철근공','콘크리트공','조적·미장','방수','도장','타일','창호·금속','내장목공','비계','철거','기타 건축'],
'기계·설비':['기계설비','용접·배관','냉난방·공조','소방설비','전기설비','통신·제어','기타 설비'],
'건설기계·장비':['굴착기','불도저','휠로더','지게차','크레인','고소작업차','롤러','천공기','콘크리트 펌프카','기타 장비'],
'운송·차량':['덤프트럭','카고트럭','저상트레일러','살수차','레미콘','기타 운송'],
'현장관리·지원':['현장소장','공무·시공관리','안전관리','품질관리','신호수','보통인부','교통통제','기타 지원']
};
const modes=['기사·작업자만','장비 + 기사','장비만'],grades=['규격 협의','1.0톤','1.7톤','2.0톤','3.5톤','5톤','6톤','8톤','10톤','14톤','20톤','30톤','38톤','45톤','50톤 이상'];
const esc=v=>String(v??'').replace(/[&<>"']/g,t=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t]));
const money=v=>Number(v).toLocaleString('ko-KR')+'원',option=(arr,selected)=>arr.map(v=>'<option'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('');
const sample=[{id:'A',name:'작업자 A',trade:'굴착기',area:'대구',experience:'경력 8년'},{id:'B',name:'작업자 B',trade:'상하수도 배관',area:'경북',experience:'경력 5년'}];
function save(){localStorage.setItem(key,JSON.stringify(posts));render()}
function toast(v){$('toast').textContent=v;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function show(tab){['home','create','detail','applicants','company'].forEach(t=>$(t).classList.toggle('hidden',t!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')render()}
function rowHtml(){return '<div class="card requirement"><div class="row"><strong style="flex:2">모집 항목 <span class="num"></span></strong><button type="button" class="remove" style="flex:1">삭제</button></div><label>대분류</label><select class="major">'+option(Object.keys(categories),'토목·기반시설')+'</select><label>소분류</label><select class="minor"></select><label>모집 형태</label><select class="mode">'+option(modes,modes[0])+'</select><div class="equipmentFields hidden"><label>장비 급수·규격</label><select class="grade">'+option(grades,'규격 협의')+'</select><label>제조사</label><input class="maker" maxlength="50" placeholder="예: 현대, 두산, 볼보, CAT"><label>모델명</label><input class="model" maxlength="60" placeholder="예: HX220"><label>최소 연식</label><input class="year" type="number" min="1970" max="2100" placeholder="예: 2020"><label>필수 장비 옵션 (복수 선택 가능)</label><div class="options">'+['회전링크','틸트로테이터','브레이커','집게','퀵커플러','장축','배토판','고무트랙'].map(t=>'<label style="display:inline-block;margin:6px"><input type="checkbox" value="'+t+'" style="width:auto"> '+t+'</label>').join('')+'</div><input class="extraOptions" maxlength="100" placeholder="기타 필수 옵션 직접 입력"></div><div class="row"><div><label>날짜별 필요 인원·대수</label><input class="count" type="number" min="1" max="100" value="1" required></div><div><label>하루 단가 (원)</label><input class="pay" type="number" min="0" step="1000" value="250000" required></div></div><label>경력·자격·교육 조건</label><input class="qualification" maxlength="150" placeholder="예: 경력 3년 이상, 관련 면허"><label>이 항목의 추가 조건</label><input class="notes" maxlength="150" placeholder="예: 장비 반입 가능 시간"></div>'}
function sync(row){row.querySelector('.minor').innerHTML=option(categories[row.querySelector('.major').value]);const major=row.querySelector('.major').value,minor=row.querySelector('.minor').value;row.querySelector('.equipmentFields').classList.toggle('hidden',!(major==='건설기계·장비'||major==='운송·차량'||minor.includes('굴착기')))}
function refresh(){[...document.querySelectorAll('.requirement')].forEach((r,i)=>{r.querySelector('.num').textContent=i+1;r.querySelector('.remove').disabled=document.querySelectorAll('.requirement').length===1})}
function addRow(){const box=document.createElement('div');box.innerHTML=rowHtml();const row=box.firstElementChild;$('requirements').append(row);sync(row);refresh()}
$('requirements').addEventListener('change',e=>{const row=e.target.closest('.requirement');if(!row)return;if(e.target.classList.contains('major'))sync(row);if(e.target.classList.contains('minor')||e.target.classList.contains('mode'))row.querySelector('.equipmentFields').classList.toggle('hidden',!(row.querySelector('.major').value==='건설기계·장비'||row.querySelector('.major').value==='운송·차량'||row.querySelector('.minor').value.includes('굴착기')))});
$('requirements').addEventListener('click',e=>{if(e.target.classList.contains('remove')&&document.querySelectorAll('.requirement').length>1){e.target.closest('.requirement').remove();refresh()}});
$('addRequirement').onclick=addRow;addRow();
function specs(p){return (p.requirements||[]).map(q=>esc(q.major)+' › '+esc(q.minor)+' ('+esc(q.mode)+', '+q.count+'명/대, '+money(q.pay)+')').join('<div style="margin:8px 0"></div>')}
function render(){$('postList').innerHTML=posts.length?posts.slice().reverse().map(p=>'<div class="card"><span class="tag">'+(p.closed?'마감':p.urgent?'긴급 모집':'모집 중')+'</span><h3>'+esc(p.site)+'</h3><div class="muted">'+esc(p.region)+' · '+esc(p.date)+' ~ '+esc(p.endDate||p.date)+'</div><div style="margin:10px 0">'+(p.requirements?specs(p):esc(p.trade||''))+'</div><div class="muted">모집 요강 '+(p.requirements?.length||1)+'개 · 지원 '+(p.applicants?.length||0)+'명</div><div class="row"><button data-detail="'+p.id+'">공고 보기</button><button data-applicants="'+p.id+'">지원자 확인</button></div></div>').join(''):'<div class="empty">등록된 구인이 없습니다.<br>새 구인을 등록해 보세요.</div>'}
function get(){return posts.find(p=>p.id===selected)}
function detail(){const p=get();if(!p)return show('home');$('detailContent').innerHTML='<h2>'+esc(p.site)+'</h2><div class="card"><span class="tag">'+(p.closed?'마감':'모집 중')+'</span><p>'+esc(p.region)+'</p><p>'+esc(p.date)+' ~ '+esc(p.endDate||p.date)+'</p><h3>모집 요강</h3>'+(p.requirements||[]).map(q=>'<div class="card"><b>'+esc(q.major)+' › '+esc(q.minor)+'</b><p>'+esc(q.mode)+' · '+q.count+'명/대 · '+money(q.pay)+'</p><div class="muted">장비 급수: '+esc(q.grade||'해당 없음')+' · 제조사: '+esc(q.maker||'협의')+' · 모델: '+esc(q.model||'협의')+' · 최소 연식: '+esc(q.year||'협의')+'</div><div class="muted">옵션: '+esc(q.options.join(', ')||'없음')+'</div><div class="muted">경력·자격: '+esc(q.qualification||'협의')+' / '+esc(q.notes||'')+'</div></div>').join('')+'<p>유류: '+esc(p.fuel)+'</p><p>식사: '+esc(p.meal)+' / 숙박: '+esc(p.lodging)+'</p><p>운송: '+esc(p.transportCost)+'</p><p>공개: '+esc(p.visibility)+' / 마감: '+esc(p.deadline||'미설정')+'</p><p>부분 일정 지원: '+(p.partial?'허용':'불가')+'</p><p>추가 조건: '+esc(p.memo||'없음')+'</p></div><button id="toggleClose" class="full">'+(p.closed?'모집 다시 열기':'모집 마감')+'</button>';$('toggleClose').onclick=()=>{p.closed=!p.closed;save();detail()};show('detail')}
function applicants(){const p=get();if(!p)return show('home');$('applicantContent').innerHTML='<p class="muted">가상 지원자만 표시됩니다. 실제 매칭·양측 승인은 연결되지 않았습니다.</p>'+(p.applicants||[]).map(id=>{const w=sample.find(x=>x.id===id);if(!w)return '';return '<div class="card"><h3>'+esc(w.name)+'</h3><div class="muted">'+esc(w.trade)+' · '+esc(w.experience)+'</div></div>'}).join('');show('applicants')}
document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d){selected=d.dataset.detail;detail()}const a=e.target.closest('[data-applicants]');if(a){selected=a.dataset.applicants;applicants()}});
$('start').onclick=()=>show('create');$('back').onclick=()=>show('home');$('detailBack').onclick=()=>show('home');$('applicantBack').onclick=()=>show('home');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
const d=new Date();d.setDate(d.getDate()+1);$('date').value=d.toISOString().slice(0,10);$('endDate').value=$('date').value;$('deadline').value=$('date').value;
$('jobForm').onsubmit=e=>{e.preventDefault();const start=$('date').value,end=$('endDate').value,days=Math.round((new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000)+1;if(!start||!end||days<1||days>90)return toast('작업 기간은 1~90일로 설정하세요');if($('deadline').value&&$('deadline').value>end)return toast('마감일을 확인하세요');const requirements=[...document.querySelectorAll('.requirement')].map(row=>{const val=s=>row.querySelector('.'+s).value,major=val('major'),minor=val('minor'),isEq=major==='건설기계·장비'||major==='운송·차량'||minor.includes('굴착기');return {major,minor,mode:val('mode'),count:Number(val('count')),pay:Number(val('pay')),grade:isEq?val('grade'):'',maker:isEq?val('maker'):'',model:isEq?val('model'):'',year:isEq?val('year'):'',options:isEq?[...row.querySelectorAll('.options input:checked')].map(i=>i.value).concat(val('extraOptions')?[val('extraOptions')]:[]):[],qualification:val('qualification'),notes:val('notes')}});if(requirements.some(q=>!Number.isInteger(q.count)||q.count<1||q.count>100||!Number.isFinite(q.pay)||q.pay<0))return toast('모집 인원과 단가를 확인하세요');const p={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),site:$('site').value.trim(),region:$('region').value+' '+$('district').value.trim()+' '+$('town').value.trim(),date:start,endDate:end,requirements,fuel:$('fuel').value,visibility:$('visibility').value,deadline:$('deadline').value,partial:$('partial').checked,urgent:$('urgent').checked,meal:$('meal').value,lodging:$('lodging').value,transportCost:$('transportCost').value,memo:$('memo').value.trim(),closed:false,applicants:[],confirmed:[]};if(!p.site||!$('district').value.trim())return toast('현장과 지역을 입력하세요');posts.push(p);save();$('jobForm').reset();$('requirements').innerHTML='';addRow();toast('복수 모집 요강을 등록했습니다');show('home')};
$('reset').onclick=()=>{if(!confirm('체험 기록을 모두 지울까요?'))return;posts=[];save();show('home')};render();show('home');
})();</script></body></html>
