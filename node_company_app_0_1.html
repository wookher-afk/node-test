<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE · 사람·장비 구하기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#19283a;font-family:system-ui,-apple-system,sans-serif}main{max-width:470px;margin:auto;min-height:100vh;background:white;padding-bottom:84px}header{padding:24px 20px 12px}h1{font-size:30px;margin:0}header p{margin:4px 0;color:#65748a}section{padding:0 18px}h2{font-size:22px;margin:15px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#eaf0f7;padding:13px 15px;font-weight:700;color:#1b344f;cursor:pointer}button.primary{background:#145eae;color:white}button.full{width:100%}input,select,textarea{border:1px solid #d3deea;border-radius:10px;padding:12px;width:100%;background:#fff}label{display:block;font-size:13px;color:#526379;margin:15px 0 6px}.hint{background:#eff5fc;color:#416287;padding:12px;border-radius:11px;font-size:13px;line-height:1.5;margin:10px 0 16px}.card{border:1px solid #dfe7f0;border-radius:15px;padding:16px;margin:12px 0}.card h3{margin:7px 0;font-size:19px}.muted{color:#64748a;font-size:13px;line-height:1.7}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.tag{display:inline-block;background:#e8f3ed;color:#13764a;padding:4px 10px;border-radius:30px;font-size:12px}.big{font-size:23px;font-weight:750;margin:9px 0}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;display:flex;background:white;border-top:1px solid #e0e7ef;padding:9px;gap:7px}.bottom button{flex:1;background:white;padding:8px 4px;font-size:13px}.bottom button.active{color:#145eae;background:#eaf3ff}.empty{text-align:center;color:#7b8998;padding:30px 10px}.status{background:#f0f5fb;border-radius:10px;padding:12px;margin-top:12px;font-size:14px}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#192f49;color:white;border-radius:12px;padding:12px 17px;max-width:90%;z-index:5}textarea{resize:vertical;min-height:72px}
</style></head><body><main><header><h1>NODE</h1><p>필요한 사람과 장비, 간편하게 구하세요.</p></header><section><div class="hint">실제 구인·계약이 이루어지지 않는 <b>체험용 앱</b>입니다. 가상 인력과 현장만 표시되며 개인정보를 입력하지 마세요.</div>
<div id="home"><h2>어떤 도움이 필요하세요?</h2><button class="primary full" id="start">＋ 새 구인 등록</button><h2>내 구인 현황</h2><div id="postList"></div></div>
<div id="create" class="hidden"><button id="back" type="button">← 돌아가기</button><h2>현장에 필요한 인력</h2><form id="jobForm"><label for="site">현장 이름</label><input id="site" maxlength="50" placeholder="예: 달성군 상수관로 공사" required><label for="region">시·도 (전국)</label><select id="region"><option>서울특별시</option><option>부산광역시</option><option>대구광역시</option><option>인천광역시</option><option>광주광역시</option><option>대전광역시</option><option>울산광역시</option><option>세종특별자치시</option><option>경기도</option><option>강원특별자치도</option><option>충청북도</option><option>충청남도</option><option>전북특별자치도</option><option>전라남도</option><option>경상북도</option><option>경상남도</option><option>제주특별자치도</option></select><label for="district">시·군·구</label><input id="district" maxlength="50" placeholder="예: 달성군 / 합천군" required><label for="town">읍·면·동 또는 현장 주소 (선택)</label><input id="town" maxlength="80" placeholder="예: 가야면"><label for="trade">무엇이 필요하세요?</label><select id="trade"><option>굴착기 기사</option><option>배관공</option><option>신호수</option><option>보조 인력</option><option>굴착기 + 기사</option><option>굴착기 장비만</option><option>덤프트럭</option><option>운송차량</option></select><div class="row"><div><label for="date">시작일</label><input id="date" type="date" required></div><div><label for="endDate">종료일</label><input id="endDate" type="date" required></div></div><div class="row"><div><label for="count">날짜별 필요 인원/대수</label><input id="count" type="number" min="1" max="30" value="1" required></div></div><label for="pay">하루 단가 (원)</label><input id="pay" type="number" min="0" step="1000" value="250000" required><label for="fuel">유류 부담</label><select id="fuel"><option>현장 부담</option><option>작업자·장비 소유자 부담</option><option>해당 없음</option></select><label for="workMode">모집 형태</label><select id="workMode"><option>기사만</option><option>장비 + 기사</option><option>장비만</option></select><label for="visibility">공개 범위</label><select id="visibility"><option>전체 공개</option><option>지정 작업자 공개</option><option>비공개 직접 제안</option></select><label for="deadline">지원 마감일</label><input id="deadline" type="date"><label><input type="checkbox" id="partial" style="width:auto" checked> 일부 날짜 지원 허용</label><label><input type="checkbox" id="urgent" style="width:auto"> 긴급 구인</label><label for="meal">식사</label><select id="meal"><option>제공</option><option>미제공</option><option>협의</option></select><label for="lodging">숙박</label><select id="lodging"><option>미제공</option><option>제공</option><option>협의</option></select><label for="transportCost">이동·운송비</label><select id="transportCost"><option>별도 협의</option><option>업체 부담</option><option>작업자 부담</option></select><label for="memo">추가 조건 (선택)</label><textarea id="memo" maxlength="180" placeholder="예: 오전 8시 시작, 숙식 제공"></textarea><div style="height:15px"></div><button class="primary full" type="submit">구인 등록하기</button></form></div>
<div id="detail" class="hidden"><button id="detailBack">← 구인 현황</button><div id="detailContent"></div></div>
<div id="applicants" class="hidden"><button id="applicantBack">← 구인 현황</button><h2>지원자 확인</h2><div id="applicantContent"></div></div>
<div id="company" class="hidden"><h2>내 업체</h2><div class="card"><b>NODE 체험 업체</b><p class="muted">실제 업체 등록·사업자 인증은 연결되지 않았습니다.</p></div><button id="reset" class="full">체험 기록 초기화</button></div>
</section><nav class="bottom"><button data-tab="home" class="active">⌂<div>구인 현황</div></button><button data-tab="create">＋<div>구인 등록</div></button><button data-tab="company">♙<div>내 업체</div></button></nav></main><div id="toast" class="hidden" role="status"></div>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),key='node-company-app-v1';let posts=[];try{const x=JSON.parse(localStorage.getItem(key));if(Array.isArray(x))posts=x}catch(e){}let selected=null;const sample=[{id:'A',name:'작업자 A',trade:'굴착기 기사',area:'대구',experience:'경력 8년',status:'대기'},{id:'B',name:'작업자 B',trade:'배관공',area:'경북',experience:'경력 5년',status:'대기'},{id:'C',name:'작업자 C',trade:'굴착기 + 기사',area:'경남',experience:'경력 10년',status:'대기'}];const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v).toLocaleString('ko-KR')+'원';function save(){localStorage.setItem(key,JSON.stringify(posts));render()}function toast(v){$('toast').textContent=v;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}function show(tab){['home','create','detail','applicants','company'].forEach(t=>$(t).classList.toggle('hidden',t!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')render()}function render(){$('postList').innerHTML=posts.length?posts.slice().reverse().map(p=>'<div class="card"><span class="tag">'+(p.closed?'마감':p.confirmed.length>=p.count?'모집 완료':p.urgent?'긴급 모집':'모집 중')+'</span><h3>'+esc(p.site)+'</h3><div class="muted">'+esc(p.region)+' · '+esc(p.trade)+' · '+esc(p.date)+(p.endDate&&p.endDate!==p.date?' ~ '+esc(p.endDate):'')+'</div><div class="big">'+money(p.pay)+'</div><div class="muted">확정 '+p.confirmed.length+'/'+p.count+' · 지원 '+p.applicants.length+'명</div><div class="row" style="margin-top:12px"><button data-detail="'+p.id+'">공고 보기</button><button data-applicants="'+p.id+'">지원자 확인</button></div></div>').join(''):'<div class="empty">등록된 구인이 없습니다.<br>새 구인을 등록해 보세요.</div>'}function get(){return posts.find(p=>p.id===selected)}function detail(){const p=get();if(!p)return show('home');$('detailContent').innerHTML='<h2>'+esc(p.site)+'</h2><div class="card"><span class="tag">'+(p.closed?'마감':'모집 중')+'</span><div class="big">'+money(p.pay)+'</div><div>직종: '+esc(p.trade)+'</div><div>지역: '+esc(p.region)+'</div><div>날짜: '+esc(p.date)+'</div><div>인원: '+p.count+'명</div><div>유류: '+esc(p.fuel)+'</div><div>조건: '+esc(p.memo||'없음')+'</div><div class="status">확정 '+p.confirmed.length+'명 / 모집 '+p.count+'명</div></div><button id="toggleClose" class="full">'+(p.closed?'모집 다시 열기':'모집 마감')+'</button>'; $('toggleClose').onclick=()=>{p.closed=!p.closed;save();detail()};show('detail')}function applicantPage(){const p=get();if(!p)return show('home');$('applicantContent').innerHTML='<p class="muted">지원자는 실제 사용자가 아닌 체험용 가상 인력입니다. 실제 지원·알림은 발생하지 않습니다.</p>'+p.applicants.map(id=>{const w=sample.find(x=>x.id===id),yes=p.confirmed.includes(id);return '<div class="card"><span class="tag">'+(yes?'확정':'지원 접수')+'</span><h3>'+esc(w.name)+'</h3><div class="muted">'+esc(w.trade)+' · '+esc(w.area)+' · '+esc(w.experience)+'</div><div class="row" style="margin-top:12px"><button data-select="'+id+'" '+(yes||p.closed||p.confirmed.length>=p.count?'disabled':'')+'>'+(yes?'확정 완료':'매칭 확정')+'</button></div></div>'}).join('')+'<div class="status">이 체험에서는 업체의 확정 버튼으로 즉시 처리됩니다. 실제 서비스에는 작업자 동의와 조건 재확인이 필요합니다.</div>';show('applicants')}document.addEventListener('click',e=>{const d=e.target.closest('[data-detail]');if(d){selected=d.dataset.detail;detail()}const a=e.target.closest('[data-applicants]');if(a){selected=a.dataset.applicants;applicantPage()}const b=e.target.closest('[data-select]');if(b){const p=get();if(!p||p.closed||p.confirmed.length>=p.count||!p.applicants.includes(b.dataset.select))return;p.confirmed.push(b.dataset.select);save();applicantPage();toast('가상 매칭이 확정되었습니다')}});$('start').onclick=()=>show('create');$('back').onclick=()=>show('home');$('detailBack').onclick=()=>show('home');$('applicantBack').onclick=()=>show('home');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));const d=new Date();d.setDate(d.getDate()+1);$('date').value=d.toISOString().slice(0,10);$('endDate').value=$('date').value;$('deadline').value=$('date').value;$('jobForm').onsubmit=e=>{e.preventDefault();const count=Number($('count').value),pay=Number($('pay').value);if(!Number.isInteger(count)||count<1||count>30||!Number.isFinite(pay)||pay<0)return toast('인원과 단가를 확인하세요');const start=$('date').value,end=$('endDate').value,deadline=$('deadline').value;const days=Math.round((new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000)+1;if(!end||days<1||days>90)return toast('기간은 1~90일로 설정하세요');if(deadline&&deadline>end)return toast('지원 마감일을 확인하세요');const trade=$('trade').value;const matching=$('visibility').value==='전체 공개'?sample.filter(w=>w.trade===trade).map(w=>w.id):[];const p={id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),site:$('site').value.trim(),region:$('region').value+' '+$('district').value.trim()+' '+$('town').value.trim(),trade,date:start,endDate:end,count,pay,fuel:$('fuel').value,workMode:$('workMode').value,visibility:$('visibility').value,deadline,partial:$('partial').checked,urgent:$('urgent').checked,meal:$('meal').value,lodging:$('lodging').value,transportCost:$('transportCost').value,memo:$('memo').value.trim(),closed:false,applicants:matching,confirmed:[],version:1};if(!p.site||!p.date||!$('district').value.trim())return toast('현장·지역·날짜를 입력하세요');posts.push(p);save();$('jobForm').reset();$('count').value=1;$('pay').value=250000;$('endDate').value=$('date').value;$('deadline').value=$('date').value;toast('체험용 구인이 등록되었습니다');show('home')};$('reset').onclick=()=>{if(!confirm('체험 기록을 모두 지울까요?'))return;posts=[];save();show('home');toast('초기화되었습니다')};render();show('home')})();</script></body></html>
