name: NODE matching PostgreSQL tests
on:
  push:
    branches: [develop/node-0.1-foundation]
    paths:
      - 'db/**'
      - 'tests/**'
      - '.github/workflows/node-matching-tests.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'tests/**'
      - '.github/workflows/node-matching-tests.yml'
  workflow_dispatch:
jobs:
  postgres-matching:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: node_test
          POSTGRES_PASSWORD: node_test_only
          POSTGRES_DB: node_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U node_test -d node_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: node_test
      PGPASSWORD: node_test_only
      PGDATABASE: node_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply foundation migration
        run: psql -v ON_ERROR_STOP=1 -f db/001_foundation.sql
      - name: Apply matching migration
        run: psql -v ON_ERROR_STOP=1 -f db/002_matching.sql
      - name: Apply cancellation authorization migration
        run: psql -v ON_ERROR_STOP=1 -f db/003_cancel_authorization.sql
      - name: Run cancellation authorization tests
        run: psql -v ON_ERROR_STOP=1 -f tests/cancellation_authorization.sql
      - name: Run matching regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/matching_regression.sql

      - name: Run two-session concurrency test
        run: bash tests/matching_concurrency.sh
