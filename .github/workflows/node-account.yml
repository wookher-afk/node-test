name: NODE account end-to-end
on:
  push:
    paths:
      - 'server/**'
      - 'web/**'
      - 'database/**'
      - 'package.json'
      - '.github/workflows/node-account.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'database/**'
      - 'package.json'
      - '.github/workflows/node-account.yml'
jobs:
  account-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: node
          POSTGRES_PASSWORD: node_test_only
          POSTGRES_DB: node_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U node -d node_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: node_test_only
      DATABASE_URL: postgresql://node:node_test_only@localhost:5432/node_test
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply database schema
        run: |
          psql -h localhost -U node -d node_test -v ON_ERROR_STOP=1 -f database/001_foundation.sql
          psql -h localhost -U node -d node_test -v ON_ERROR_STOP=1 -f database/002_accounts.sql
      - name: Run account integration
        run: node --test tests/account.test.js
