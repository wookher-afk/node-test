name: NODE DB foundation
on:
  push:
    paths:
      - 'database/**'
      - '.github/workflows/node-db.yml'
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/node-db.yml'
jobs:
  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: node
          POSTGRES_PASSWORD: node_test_only
          POSTGRES_DB: node_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U node -d node_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: node_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema
        run: psql -h localhost -U node -d node_test -v ON_ERROR_STOP=1 -f database/001_foundation.sql
      - name: Smoke test
        run: psql -h localhost -U node -d node_test -v ON_ERROR_STOP=1 -f database/001_smoke_test.sql
