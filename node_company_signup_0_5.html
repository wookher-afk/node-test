function getPositions(){if(!Array.isArray(db.company.c_positions))db.company.c_positions=[{category:'',job:'',count:'1',experience:'',difficulty:'',size:'',hire:'',pay:'',payUnit:'일당'}];return db.company.c_positions}
function capturePositions(){const cards=document.querySelectorAll('#positions .position-card');if(!cards.length)return;db.company.c_positions=[...cards].map(card=>{let p={};card.querySelectorAll('[data-field]').forEach(el=>p[el.dataset.field]=el.value);return p})}
function positionOptions(values,selected){return '<option value="">선택하세요</option>'+values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function findCategory(job){return Object.keys(JOBS).find(cat=>JOBS[cat].includes(job))||''}
function renderPositions(){const target=document.getElementById('positions');if(!target)return;target.innerHTML=getPositions().map((pos,i)=>{const cat=pos.category||findCategory(pos.job),equip=isEquipment(pos.job),sizes=EQUIPMENT_SIZES[pos.job]||['소형','중형','대형','기타·협의'];return `<div class="position-card" style="border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;background:#f9fbff"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong>모집 ${i+1}</strong><button type="button" class="btn danger" onclick="removePosition(${i})" ${getPositions().length===1?'disabled':''}>삭제</button></div><div class="fields"><div class="field"><label>모집 분야 · 대분류</label><select data-field="category" onchange="changeCategory(this)">${positionOptions(Object.keys(JOBS),cat)}</select></div><div class="field"><label>세부 모집 직종</label><select data-field="job" onchange="changeJob(this)">${positionOptions(JOBS[cat]||[],pos.job)}</select></div><div class="field custom-job" style="display:${pos.job==='기타 직종(직접 입력)'?'':'none'}"><label>직종 직접 입력</label><input data-field="customJob" placeholder="직종명을 입력하세요" value="${esc(pos.customJob||'')}"></div><div class="field"><label>모집 인원</label><input data-field="count" type="number" min="1" step="1" placeholder="명" value="${esc(pos.count||'1')}"></div><div class="field"><label>경력 조건</label><select data-field="experience">${positionOptions(['신입 가능','경력자 우대','경력자 필수','무관'],pos.experience)}</select></div><div class="field"><label>작업 난이도</label><select data-field="difficulty">${positionOptions(['초급','보통','높음','전문 기술 필요'],pos.difficulty)}</select></div><div class="field equipment-only" style="display:${equip?'':'none'}"><label>필요 장비 규격</label><select data-field="size">${positionOptions(sizes,pos.size)}</select></div><div class="field equipment-only" style="display:${equip?'':'none'}"><label>모집 형태</label><select data-field="hire" onchange="updatePayLabel(this)">${positionOptions(['기사만 모집','자가장비 포함 기사 모집','모두 가능'],pos.hire)}</select></div><div class="field"><label class="pay-label">${equip&&pos.hire==='자가장비 포함 기사 모집'?'장비·기사 투입 단가':'급여·투입 단가'}</label><input data-field="pay" type="number" min="0" step="1000" placeholder="금액 (원)" value="${esc(pos.pay||'')}"></div><div class="field"><label>금액 기준</label><select data-field="payUnit">${positionOptions(['일당','월급','시급','반일','협의'],pos.payUnit||'일당')}</select></div></div></div>`}).join('')}
function changeCategory(el){const card=el.closest('.position-card'),job=card.querySelector('[data-field="job"]');job.innerHTML=positionOptions(JOBS[el.value]||[],'');card.querySelector('[data-field="customJob"]').value='';changeJob(job)}
function changeJob(el){const card=el.closest('.position-card'),job=el.value,equip=isEquipment(job);card.querySelector('.custom-job').style.display=job==='기타 직종(직접 입력)'?'':'none';card.querySelectorAll('.equipment-only').forEach(x=>x.style.display=equip?'':'none');const size=card.querySelector('[data-field="size"]');size.innerHTML=positionOptions(EQUIPMENT_SIZES[job]||['소형','중형','대형','기타·협의'],'');if(!equip)card.querySelector('[data-field="hire"]').value='';updatePayLabel(el)}
function updatePayLabel(el){const card=el.closest('.position-card'),hire=card.querySelector('[data-field="hire"]').value;card.querySelector('.pay-label').textContent=isEquipment(card.querySelector('[data-field="job"]').value)&&hire==='자가장비 포함 기사 모집'?'장비·기사 투입 단가':'급여·투입 단가'}
