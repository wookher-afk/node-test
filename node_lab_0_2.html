<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE LAB 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:system-ui,-apple-system,sans-serif;color:#192a3b}main{max-width:560px;margin:auto;background:white;min-height:100vh;padding:18px 18px 95px}h1{margin:0;font-size:30px}h2{font-size:21px;margin:15px 0}p,small{color:#627184}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:12px;background:#e8eff6;color:#183958;font-weight:650;cursor:pointer}button.primary{background:#1265ae;color:white}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:9px;background:white}label{font-size:13px;color:#53677c;display:block;margin:12px 0 5px}.card{border:1px solid #dce4ed;border-radius:13px;padding:14px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#627184;font-size:13px}.pill{display:inline-block;background:#eaf3fc;border-radius:30px;padding:5px 9px;font-size:12px;color:#145a95}.tabs{display:flex;gap:5px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:white;border-top:1px solid #ddd;padding:9px}.tabs button{flex:1;padding:12px 4px;font-size:13px}.tabs .on{background:#1265ae;color:white}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{width:100%;margin-top:12px}.notice{background:#fff8e7;padding:12px;border-radius:10px;font-size:12px;color:#795e24}.tag{background:#f0f4f8;padding:3px 8px;border-radius:8px;font-size:12px}.item{border-left:3px solid #1265ae;padding-left:12px;margin:10px 0}
</style></head><body><main><header class="row"><div><h1>NODE <span style="font-size:13px;color:#627184">LAB 0.2</span></h1><small>일의 기록 = 신뢰</small></div><button onclick="reset()">초기화</button></header><p class="notice">연구용 통합 시뮬레이터 · 모든 인물/업체/거래는 가상 데이터입니다. 데이터는 이 브라우저에만 저장되며 실제 매칭·결제·인증은 실행되지 않습니다.</p><div id="view"></div></main><nav class="tabs" id="nav"></nav>
<script>
const K='node-lab-02';const initial=()=>({tab:'jobs',role:'worker',jobs:[{id:1,site:'달성군 상수관로',region:'대구',district:'달성군',date:'2026-10-28',items:[{major:'건설기계',minor:'굴착기',count:2,pay:30,mode:'장비+기사',grade:'06W',maker:'현대',option:'회전링크',fuel:'업체',filled:0},{major:'토목',minor:'배관공',count:3,pay:23,mode:'기사만',filled:0}],status:'모집중'}],applications:[],matches:[],calendar:[],payments:[],transports:[],events:[]});let s;try{s=JSON.parse(localStorage.getItem(K))||initial()}catch(e){s=initial()}let selection=null;let formItems=[];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(s));const log=x=>{s.events.unshift({at:new Date().toLocaleString('ko-KR'),text:x});save()};const majors={'토목':['배관공','신호수','토목공','용접공'],'건설기계':['굴착기','불도저','로더','크레인'],'운송':['덤프트럭','장비운송'],'건축':['목수','철근공','미장공'],'현장관리':['안전관리','현장관리']};const money=n=>Number(n||0).toLocaleString('ko-KR')+'만원';const tabs=[['jobs','구인'],['matches','매칭'],['calendar','일정'],['transport','운송'],['records','기록']];function setTab(t){s.tab=t;save();render()}function setRole(r){s.role=r;save();render()}function reset(){if(confirm('시뮬레이션 데이터를 모두 초기화할까요?')){s=initial();save();render()}}function render(){const nav=$('nav');nav.innerHTML=tabs.map(([k,v])=>'<button class="'+(s.tab===k?'on':'')+'" onclick="setTab(\''+k+'\')">'+v+'</button>').join('');$('view').innerHTML='<div class="row" style="margin-top:16px"><strong>'+(s.role==='worker'?'작업자 모드':'업체 모드')+'</strong><button onclick="setRole(\''+(s.role==='worker'?'company':'worker')+'\')">↔ '+(s.role==='worker'?'업체':'작업자')+' 전환</button></div>'+({jobs:jobsView,matches:matchesView,calendar:calendarView,transport:transportView,records:recordsView}[s.tab])()}function jobsView(){let out='<h2>현장·구인</h2>';if(s.role==='company')out+='<button class="primary action" onclick="jobForm()">＋ 현장·복수 직종 등록</button>';out+='<label>지역 검색</label><select id="region" onchange="filterJobs()"><option value="">전국</option>'+['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'].map(x=>'<option>'+x+'</option>').join('')+'</select><div id="jobList">'+jobCards('')+'</div>';return out}function filterJobs(){$('jobList').innerHTML=jobCards($('region').value)}function jobCards(region){return s.jobs.filter(j=>!region||j.region===region).map(j=>'<div class="card"><div class="row"><strong>'+esc(j.site)+'</strong><span class="pill">'+esc(j.status)+'</span></div><p>'+esc(j.region)+' '+esc(j.district)+' · '+esc(j.date)+'</p>'+j.items.map((it,i)=>'<div class="item"><b>'+esc(it.major)+' › '+esc(it.minor)+'</b><div class="muted">'+esc(it.mode||'기사만')+' · '+money(it.pay)+'/일 · 잔여 '+(it.count-it.filled)+'/'+it.count+'명 '+(it.grade?' · '+esc(it.grade):'')+'</div>'+(s.role==='worker'?'<button style="margin-top:8px" '+(it.count<=it.filled?'disabled':'')+' onclick="apply('+j.id+','+i+')">지원하기</button>':'')+'</div>').join('')+'</div>').join('')||'<p>조건에 맞는 공고가 없습니다.</p>'}function apply(id,i){const j=s.jobs.find(x=>x.id===id);const it=j.items[i];if(s.applications.some(a=>a.jobId===id&&a.item===i&&a.status!=='철회'))return alert('이미 지원한 모집 항목입니다.');if(s.calendar.some(c=>c.date===j.date&&c.type==='차단'))return alert('해당 날짜는 사용 불가 일정입니다.');s.applications.push({id:Date.now(),jobId:id,item:i,status:'지원',date:j.date});log(j.site+' · '+it.minor+' 지원');render()}function jobForm(){formItems=[{major:'토목',minor:'배관공',count:1,pay:25,mode:'기사만'}];$('view').innerHTML='<h2>현장 등록</h2><label>현장명</label><input id="site" placeholder="예: 가야면 관로공사"><div class="grid"><div><label>시·도</label><select id="prov">'+['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div><label>시·군·구</label><input id="district" placeholder="예: 달성군"></div></div><label>작업일</label><input type="date" id="date" value="2026-10-28"><div id="items"></div><button class="action" onclick="addItem()">＋ 모집 직종 추가</button><button class="primary action" onclick="submitJob()">현장 등록</button><button class="action" onclick="render()">취소</button>';drawItems()}function addItem(){readItems();formItems.push({major:'토목',minor:'배관공',count:1,pay:25,mode:'기사만'});drawItems()}function readItems(){formItems=formItems.map((it,i)=>{const q=k=>document.getElementById('i'+i+k)?.value;return {...it,major:q('major')||it.major,minor:q('minor')||it.minor,count:Number(q('count')||1),pay:Number(q('pay')||0),mode:q('mode')||'기사만',grade:q('grade')||'',maker:q('maker')||'',model:q('model')||'',year:q('year')||'',option:q('option')||'',fuel:q('fuel')||''}})}function updateMajor(i){readItems();formItems[i].major=$('i'+i+'major').value;formItems[i].minor=majors[formItems[i].major][0];drawItems()}function removeItem(i){readItems();formItems.splice(i,1);drawItems()}function drawItems(){$('items').innerHTML=formItems.map((it,i)=>'<div class="card"><div class="row"><b>모집 '+(i+1)+'</b><button onclick="removeItem('+i+')">삭제</button></div><label>대분류</label><select id="i'+i+'major" onchange="updateMajor('+i+')">'+Object.keys(majors).map(x=>'<option '+(x===it.major?'selected':'')+'>'+x+'</option>').join('')+'</select><label>소분류</label><select id="i'+i+'minor">'+majors[it.major].map(x=>'<option '+(x===it.minor?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="grid"><div><label>모집 인원</label><input type="number" min="1" id="i'+i+'count" value="'+it.count+'"></div><div><label>일당 (만원)</label><input type="number" min="0" id="i'+i+'pay" value="'+it.pay+'"></div></div><label>모집 형태</label><select id="i'+i+'mode">'+['기사만','장비+기사','장비만'].map(x=>'<option '+(x===it.mode?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="grid">'+[['grade','장비 급수'],['maker','제조사'],['model','모델명'],['year','최소 연식'],['option','필수 옵션'],['fuel','유류 부담']].map(([k,v])=>'<div><label>'+v+'</label><input id="i'+i+k+'" value="'+esc(it[k]||'')+'"></div>').join('')+'</div></div>').join('')}function submitJob(){readItems();const site=$('site').value.trim(),date=$('date').value;if(!site||!date||!formItems.length||formItems.some(i=>!i.minor||i.count<1||i.pay<0))return alert('현장명·날짜·모집 조건을 확인하세요.');s.jobs.unshift({id:Date.now(),site,region:$('prov').value,district:$('district').value,date,items:formItems.map(x=>({...x,filled:0})),status:'모집중'});log(site+' 현장 등록');render()}function matchesView(){let out='<h2>지원·매칭</h2>';if(s.role==='company'){out+=s.applications.map(a=>{const j=s.jobs.find(x=>x.id===a.jobId),it=j?.items[a.item];return '<div class="card"><b>'+esc(j?.site)+' · '+esc(it?.minor)+'</b><p>가상 지원자 · '+esc(a.date)+' · '+esc(a.status)+'</p>'+(a.status==='지원'?'<button class="primary" onclick="offer('+a.id+')">조건 제안</button>':'')+'</div>'}).join('')}else{out+=s.applications.map(a=>{const j=s.jobs.find(x=>x.id===a.jobId);return '<div class="card"><b>'+esc(j?.site)+' · '+esc(j?.items[a.item]?.minor)+'</b><p>'+esc(a.date)+' · '+esc(a.status)+'</p>'+(a.status==='지원'?'<button onclick="withdraw('+a.id+')">지원 철회</button>':'')+'</div>'}).join('')}out+='<h2>매칭 계약</h2>'+s.matches.map(m=>{const j=s.jobs.find(x=>x.id===m.jobId);return '<div class="card"><b>'+esc(j?.site)+'</b><p>'+esc(m.date)+' · '+money(m.pay)+' · '+esc(m.status)+'</p><p class="muted">업체 승인 '+(m.companyApproved?'✓':'대기')+' · 작업자 승인 '+(m.workerApproved?'✓':'대기')+'</p>'+(m.status==='승인대기'?'<button class="primary" onclick="approve('+m.id+')">현재 역할로 승인</button>':'')+(m.status==='확정'?'<button onclick="finish('+m.id+')">현재 역할로 작업 완료 확인</button>':'')+(m.status!=='취소'&&m.status!=='완료'?'<button onclick="cancelMatch('+m.id+')">취소</button>':'')+'</div>'}).join('');return out||'<p>진행 중인 매칭이 없습니다.</p>'}function withdraw(id){s.applications.find(x=>x.id===id).status='철회';log('지원 철회');render()}function offer(id){const a=s.applications.find(x=>x.id===id),j=s.jobs.find(x=>x.id===a.jobId),it=j.items[a.item];if(it.filled>=it.count)return alert('모집 정원이 찼습니다.');a.status='제안';s.matches.push({id:Date.now(),jobId:j.id,item:a.item,date:j.date,pay:it.pay,status:'승인대기',companyApproved:true,workerApproved:false,companyDone:false,workerDone:false});log('업체 매칭 제안');render()}function approve(id){const m=s.matches.find(x=>x.id===id);if(s.role==='worker')m.workerApproved=true;else m.companyApproved=true;if(m.workerApproved&&m.companyApproved){const j=s.jobs.find(x=>x.id===m.jobId),it=j.items[m.item];if(it.filled>=it.count||s.matches.some(x=>x.id!==m.id&&x.status==='확정'&&x.date===m.date)){alert('정원 또는 일정 충돌로 확정할 수 없습니다.');m.workerApproved=false;save();return render()}it.filled++;m.status='확정';s.calendar.push({date:m.date,type:'확정',text:j.site});}log('매칭 승인');render()}function finish(id){const m=s.matches.find(x=>x.id===id);if(s.role==='worker')m.workerDone=true;else m.companyDone=true;if(m.workerDone&&m.companyDone){m.status='완료';s.payments.push({id:Date.now(),matchId:id,amount:m.pay,paid:false,received:false});}log('작업 완료 확인');render()}function cancelMatch(id){const m=s.matches.find(x=>x.id===id),reason=prompt('취소 사유를 입력하세요.');if(reason===null)return;if(m.status==='확정'){const j=s.jobs.find(x=>x.id===m.jobId);j.items[m.item].filled=Math.max(0,j.items[m.item].filled-1);s.calendar=s.calendar.filter(x=>!(x.date===m.date&&x.type==='확정'))}m.status='취소';m.reason=reason;log('매칭 취소: '+reason);render()}function calendarView(){return '<h2>통합 일정</h2><div class="card"><label>일정 날짜</label><input id="cdate" type="date"><label>일정 유형</label><select id="ctype"><option>차단</option><option>외부작업</option><option>휴가</option></select><label>내용</label><input id="ctext" placeholder="일정 메모"><button class="primary action" onclick="addCalendar()">일정 등록</button></div>'+s.calendar.map((c,i)=>'<div class="card row"><div><b>'+esc(c.date)+'</b><p>'+esc(c.type)+' · '+esc(c.text)+'</p></div>'+(c.type==='확정'?'':'<button onclick="removeCalendar('+i+')">삭제</button>')+'</div>').join('')}function addCalendar(){if(!$('cdate').value)return alert('날짜를 선택하세요.');s.calendar.push({date:$('cdate').value,type:$('ctype').value,text:$('ctext').value});log('일정 등록');render()}function removeCalendar(i){s.calendar.splice(i,1);save();render()}function transportView(){return '<h2>장비 운송</h2><div class="card"><label>장비 규격</label><input id="tgrade" placeholder="예: 굴착기 06W"><label>출발지</label><input id="tfrom" placeholder="장비 보관지"><label>도착지</label><input id="tto" placeholder="현장 주소"><label>운송일</label><input type="date" id="tdate"><label>운송비 부담자</label><select id="tpayer"><option>현장 업체</option><option>장비 소유자</option></select><button class="primary action" onclick="addTransport()">운송 요청 등록</button></div>'+s.transports.map((t,i)=>'<div class="card"><b>'+esc(t.grade)+'</b><p>'+esc(t.from)+' → '+esc(t.to)+' · '+esc(t.date)+'</p><span class="pill">'+esc(t.status)+'</span><p>비용 부담: '+esc(t.payer)+'</p><button onclick="nextTransport('+i+')">다음 단계 확인</button></div>').join('')+'<p class="muted">차량 적재능력·보험·운송업자 인증은 서버 연동 전이므로 자동 검증하지 않습니다.</p>'}function addTransport(){if(!['tgrade','tfrom','tto','tdate'].every(x=>$(x).value.trim()))return alert('운송 정보를 모두 입력하세요.');s.transports.push({grade:$('tgrade').value,from:$('tfrom').value,to:$('tto').value,date:$('tdate').value,payer:$('tpayer').value,status:'운송 요청'});log('운송 요청 등록');render()}function nextTransport(i){const t=s.transports[i],states=['운송 요청','운송업자 수락','인도 확인','인수 확인','운송 완료'];t.status=states[Math.min(states.indexOf(t.status)+1,states.length-1)];log('운송 상태: '+t.status);render()}function recordsView(){return '<h2>작업·대금·신뢰 기록</h2><p class="muted">작업 완료와 대금 지급은 서로 독립된 상태입니다.</p>'+s.payments.map(p=>{const m=s.matches.find(x=>x.id===p.matchId),j=s.jobs.find(x=>x.id===m?.jobId);return '<div class="card"><b>'+esc(j?.site)+'</b><p>지급액 '+money(p.amount)+'</p><p>업체 지급 등록: '+(p.paid?'완료':'대기')+' / 작업자 수령 확인: '+(p.received?'완료':'대기')+'</p>'+(s.role==='company'&&!p.paid?'<button onclick="payment('+p.id+',\'paid\')">지급 등록</button>':'')+(s.role==='worker'&&p.paid&&!p.received?'<button onclick="payment('+p.id+',\'received\')">입금 확인</button>':'')+'</div>'}).join('')+'<h2>활동 이력</h2>'+s.events.map(e=>'<div class="item"><b>'+esc(e.text)+'</b><p>'+esc(e.at)+'</p></div>').join('')+'<p class="notice">신뢰 점수는 임의로 생성하지 않습니다. 실제 거래 증빙·이의신청·검증 정책이 갖춰지기 전까지 원본 이력만 표시합니다.</p>'}function payment(id,k){s.payments.find(x=>x.id===id)[k]=true;log(k==='paid'?'업체 지급 등록':'작업자 입금 확인');render()}render();
</script></body></html>
