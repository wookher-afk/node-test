<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NODE · 일자리 찾기</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1c293b;font-family:system-ui,-apple-system,sans-serif}main{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding-bottom:85px}header{padding:25px 22px 16px}h1{margin:0;font-size:30px;letter-spacing:-1px}p{margin:5px 0;color:#637084}h2{font-size:22px;margin:10px 0 16px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:14px 16px;background:#e9eef5;color:#1b334c;cursor:pointer;font-weight:650}button.primary{background:#135fb4;color:white}button:disabled{opacity:.45}button.full{width:100%}.content{padding:0 18px}.hint{background:#eef5ff;border-radius:12px;padding:12px 14px;font-size:13px;color:#3c5b82;margin-bottom:17px}.filters{display:flex;gap:8px;margin-bottom:15px}select,input{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:10px;background:white}.job{border:1px solid #e2e8ef;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #14243a08}.job .top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{background:#eaf5ef;color:#187247;font-size:12px;padding:5px 9px;border-radius:30px}.job h3{margin:12px 0 7px;font-size:21px}.job .pay{font-size:23px;font-weight:750;margin:13px 0}.job .meta{font-size:14px;color:#536274;line-height:1.8}.job button{margin-top:13px}.hidden{display:none!important}.back{background:transparent;padding:8px 0;color:#456}label{display:block;font-size:13px;color:#56657a;margin:15px 0 6px}.detail{border:1px solid #e2e8ef;border-radius:15px;padding:18px;margin:12px 0;line-height:1.9}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;display:flex;background:white;border-top:1px solid #e3e8f0;padding:9px;gap:8px}.bottom button{flex:1;background:white;font-size:13px;padding:9px 4px}.bottom button.on{color:#145fb5;background:#eaf3ff}.status{border-radius:12px;background:#eef5ff;padding:13px;margin:10px 0}.muted{font-size:13px;color:#6b7685}.big{font-size:21px;font-weight:750}.empty{padding:35px 10px;text-align:center;color:#6b7685}#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#182d45;color:white;padding:12px 17px;border-radius:12px;max-width:400px;width:max-content;z-index:3}
</style></head><body><main><header><h1>NODE</h1><p>내게 맞는 현장, 간편하게 찾으세요.</p></header><div class="content">
<div class="hint">체험용 화면입니다. 실제 지원·회원가입은 진행되지 않습니다. 개인정보를 입력하지 마세요.</div>
<div id="home"><h2>오늘의 일자리</h2><div class="filters"><select id="region" aria-label="지역"><option value="all">전체 지역</option><option value="대구">대구</option><option value="경북">경북</option><option value="경남">경남</option></select><select id="trade" aria-label="직종"><option value="all">전체 직종</option><option>굴착기 기사</option><option>배관공</option><option>신호수</option><option>보조 인력</option></select></div><div id="joblist"></div></div>
<div id="detail" class="hidden"><button class="back" id="back">← 일자리 목록</button><h2 id="detailTitle"></h2><div id="detailBody" class="detail"></div><button class="primary full" id="apply">이 현장에 지원하기</button><p class="muted">지원은 곧 계약 확정이 아닙니다. 업체가 선택하면 조건을 다시 확인합니다.</p></div>
<div id="mine" class="hidden"><h2>내 지원 현황</h2><div id="applications"></div></div>
<div id="profile" class="hidden"><h2>내 정보</h2><div class="detail"><div class="big">체험 작업자</div><div>주 직종: 굴착기 기사</div><div>희망 지역: 대구 · 경북</div><div>일정: 등록 전</div></div><p class="muted">실제 서비스에서는 자격증, 경력, 일정과 장비를 등록할 수 있습니다.</p><button id="clear" class="full">체험 기록 초기화</button></div>
</div><nav class="bottom"><button data-page="home" class="on">⌕<div>일자리</div></button><button data-page="mine">▤<div>지원 현황</div></button><button data-page="profile">♙<div>내 정보</div></button></nav></main><div id="toast" class="hidden" role="status"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='node-worker-demo-v1';const jobs=[{id:1,trade:'굴착기 기사',region:'대구',place:'달성군 상수관로 공사',date:'2026-11-02',rate:270000,slots:1,fuel:'현장 제공',desc:'관로 터파기 및 되메우기, 굴착기 기사 모집'},{id:2,trade:'배관공',region:'경북',place:'경산시 하수관 정비',date:'2026-11-04',rate:240000,slots:2,fuel:'해당 없음',desc:'하수관 부설 작업, 경력자 우대'},{id:3,trade:'신호수',region:'대구',place:'북구 도로 정비 현장',date:'2026-11-03',rate:170000,slots:2,fuel:'해당 없음',desc:'장비 유도 및 작업구역 안전 관리'},{id:4,trade:'보조 인력',region:'경남',place:'합천군 배수로 공사',date:'2026-11-05',rate:180000,slots:3,fuel:'해당 없음',desc:'관로 설치 보조 및 현장 정리'},{id:5,trade:'굴착기 기사',region:'경북',place:'고령군 농로 정비',date:'2026-11-06',rate:260000,slots:1,fuel:'현장 제공',desc:'굴착기 기사 1명 모집, 작업시간 08:00~17:00'}];let applied=[];try{const x=JSON.parse(localStorage.getItem(key));if(Array.isArray(x))applied=x.filter(v=>Number.isInteger(v)&&jobs.some(j=>j.id===v))}catch(e){}let selected=null,page='home';const won=n=>n.toLocaleString('ko-KR')+'원';function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}function save(){localStorage.setItem(key,JSON.stringify(applied))}function show(p){page=p;['home','detail','mine','profile'].forEach(x=>$(x).classList.toggle('hidden',x!==p));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='mine')renderMine()}function renderJobs(){const r=$('region').value,t=$('trade').value,filtered=jobs.filter(j=>(r==='all'||j.region===r)&&(t==='all'||j.trade===t));$('joblist').innerHTML=filtered.length?filtered.map(j=>'<article class="job"><div class="top"><span class="tag">'+j.region+' · '+j.trade+'</span><span class="muted">모집 '+j.slots+'명</span></div><h3>'+j.place+'</h3><div class="meta">📅 '+j.date+'<br>🛠 '+j.desc+'</div><div class="pay">일당 '+won(j.rate)+'</div><button class="primary full" data-id="'+j.id+'">'+(applied.includes(j.id)?'지원 내역 보기':'자세히 보기')+'</button></article>').join(''):'<div class="empty">조건에 맞는 일자리가 없습니다.</div>'}function open(id){selected=jobs.find(j=>j.id===id);if(!selected)return;$('detailTitle').textContent=selected.place;$('detailBody').innerHTML='<b>'+selected.trade+'</b><div class="big">일당 '+won(selected.rate)+'</div><div>📅 작업일: '+selected.date+'</div><div>📍 지역: '+selected.region+'</div><div>👥 모집 인원: '+selected.slots+'명</div><div>⛽ 유류: '+selected.fuel+'</div><hr><div>'+selected.desc+'</div><p class="muted">※ 체험용 가상 공고 및 단가입니다.</p>';$('apply').textContent=applied.includes(id)?'지원 완료':'이 현장에 지원하기';$('apply').disabled=applied.includes(id);show('detail')}function renderMine(){$('applications').innerHTML=applied.length?applied.map(id=>{const j=jobs.find(x=>x.id===id);return '<div class="job"><span class="tag">업체 검토 대기</span><h3>'+j.place+'</h3><div class="meta">'+j.trade+' · '+j.date+'</div><button data-cancel="'+id+'">지원 철회</button></div>'}).join(''):'<div class="empty">아직 지원한 현장이 없습니다.<br>일자리 탭에서 현장을 찾아보세요.</div>'}document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)open(Number(b.dataset.id));const c=e.target.closest('[data-cancel]');if(c){applied=applied.filter(x=>x!==Number(c.dataset.cancel));save();renderMine();toast('지원이 철회되었습니다.')}});$('region').onchange=renderJobs;$('trade').onchange=renderJobs;$('back').onclick=()=>show('home');$('apply').onclick=()=>{if(!selected||applied.includes(selected.id))return;applied.push(selected.id);save();toast('지원이 접수되었습니다 (체험)');show('mine');renderJobs()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));$('clear').onclick=()=>{if(!confirm('체험 지원 기록을 모두 초기화할까요?'))return;applied=[];save();renderJobs();toast('초기화되었습니다')};renderJobs();show('home')})();
</script></body></html>
