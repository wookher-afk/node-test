<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NODE · 기술 및 일반작업자 등록</title>
<link rel="stylesheet" href="/ui/03-2/required-match.css"><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#192a37;background:#f5f7fa}main{max-width:1000px;margin:auto;padding:24px 16px}section{background:white;border:1px solid #e0e6eb;border-radius:16px;padding:24px;margin:20px 0}h1{font-size:26px}p{line-height:1.6}label{display:block}select,button{font:inherit;max-width:100%;padding:12px;border:1px solid #b8c6d5;border-radius:9px;background:white;color:inherit}select{width:100%;margin:8px 0 18px}button{cursor:pointer;min-height:44px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #246ad1}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.choices label{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #dbe4ed;border-radius:8px;overflow-wrap:anywhere}.choices input{width:20px;height:20px;flex-shrink:0}#occupationSummary{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#occupationSummary button{background:#edf4ff;overflow-wrap:anywhere;text-align:left}#save{background:#183e70;color:white;width:100%;border:0;margin-top:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}small{color:#536474;line-height:1.6}#notice{white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:600px){.pair,.choices{grid-template-columns:1fr}section{padding:16px}main{padding:16px 10px}}
</style></head><body><main><a href="/">NODE 첫 화면</a> · <a href="/register/worker">작업자 유형 선택</a><h1>기술 및 일반작업자 등록</h1><p id="notice" role="status">로그인 확인 중…</p>
<form id="content" hidden><section><h2>수행 가능한 직종</h2><p>해당하는 소분류를 여러 개 체크하세요. 분류를 이동해도 선택은 유지됩니다.</p><small id="draft">검토용 분류 초안 · 추후 수정될 수 있습니다.</small>
<div class="pair"><label>대분류<select id="occupationMajor"></select></label><label>중분류<select id="occupationMiddle"></select></label></div>
<div class="actions"><button type="button" id="selectMiddle">이 중분류 전체 선택</button><button type="button" id="clearMiddle">이 중분류 전체 해제</button></div>
<div id="occupationChoices" class="choices" role="group" aria-label="소분류 직종"></div>
</section><section><h2>선택한 직종 <span id="count" aria-live="polite">0개</span></h2><button type="button" id="clearAll">선택 전체 해제</button><div id="occupationSummary"></div><small>선택 목록에서 직종을 누르면 개별 해제됩니다.</small><button id="save" type="submit">작업자 등록 정보 저장</button></section></form></main>
<script type="module" src="/ui/03-2/technical-registration.js"></script></body></html>
