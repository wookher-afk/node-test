<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NODE | 회원 및 프로필</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192a37;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:0 auto;padding:24px 18px 80px}h1{margin:12px 0 4px;font-size:30px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 16px}p{color:#61707e;line-height:1.55}.panel{background:white;border:1px solid #e0e6eb;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 3px 12px #172b3d09}label{display:block;font-size:14px;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5de;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;background:#1766cb;color:white;font-weight:700;padding:13px 16px;cursor:pointer;font-size:15px}button.secondary{background:#eaf1fb;color:#1658a9}button.outline{background:white;border:1px solid #ccd5de;color:#35485a}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none!important}.message{margin-top:14px;padding:12px;border-radius:9px;background:#eaf4ff;color:#144d82;font-size:14px}.message.error{background:#fff0ef;color:#a12323}.muted{font-size:13px}.tag{display:inline-block;background:#eef4fa;border-radius:999px;padding:5px 10px;font-size:13px;margin-right:5px}</style></head><body>
<main><h1>NODE</h1><p>건설 인력·장비 연결 플랫폼</p>
<section id="auth" class="panel"><div class="tabs"><button type="button" id="loginTab">로그인</button><button type="button" class="secondary" id="registerTab">회원가입</button></div>
<form id="authForm"><div id="nameRow" class="hidden"><label for="name">이름</label><input id="name" autocomplete="name" minlength="2" maxlength="80"></div>
<label for="email">이메일</label><input id="email" type="email" autocomplete="email" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="10"><p class="muted" id="passwordHint">가입한 이메일과 비밀번호를 입력하세요.</p>
<div class="actions"><button type="submit" id="authSubmit">로그인</button></div></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>내 계정</h2><div id="identity"></div><div id="roles" style="margin-top:12px"></div><div class="actions"><button type="button" class="outline" id="logout">로그아웃</button></div></div>
<div class="panel"><h2>작업자 프로필</h2><p class="muted">작업자와 업체를 하나의 계정에서 함께 등록할 수 있습니다.</p><form id="workerForm"><label for="experience">경력 (개월)</label><input id="experience" type="number" min="0" max="900" step="1" required><div class="actions"><button type="submit">작업자 정보 저장</button></div></form></div>
<div class="panel"><h2>내 업체</h2><div id="companyList"></div><form id="companyForm"><label for="companyName">신규 업체명</label><input id="companyName" minlength="2" maxlength="120" required><div class="actions"><button type="submit">업체 등록</button></div></form></div></section>
<div id="notice" role="status" aria-live="polite" class="hidden"></div>
</main><script>
const $=id=>document.getElementById(id);let register=false;const tokenKey='node_auth_token';let token=sessionStorage.getItem(tokenKey)||'';
function notify(message,error=false){$('notice').textContent=message;$('notice').className='message'+(error?' error':'');}
function mode(value){register=value;$('nameRow').classList.toggle('hidden',!value);$('name').required=value;$('password').autocomplete=value?'new-password':'current-password';$('authSubmit').textContent=value?'회원가입':'로그인';$('passwordHint').textContent=value?'비밀번호는 10자 이상 입력하세요.':'가입한 이메일과 비밀번호를 입력하세요.';$('loginTab').className=value?'secondary':'';$('registerTab').className=value?'':'secondary';}
async function api(path,method='GET',payload){const response=await fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(payload?{body:JSON.stringify(payload)}:{})});let data;try{data=await response.json();}catch{throw Error('서버 응답을 읽을 수 없습니다.');}if(!response.ok)throw Error(data.error||'요청에 실패했습니다.');return data;}
async function refresh(){const d=await api('/api/me');$('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');$('identity').textContent=d.account.display_name+' · '+d.account.email;$('roles').replaceChildren();for(const role of d.roles){const tag=document.createElement('span');tag.className='tag';tag.textContent=role==='worker'?'작업자':role==='company'?'업체':role;$('roles').append(tag);}$('experience').value=d.worker?.experience_months??0;$('companyList').replaceChildren();if(!d.companies.length){const p=document.createElement('p');p.className='muted';p.textContent='등록한 업체가 없습니다.';$('companyList').append(p);}for(const c of d.companies){const p=document.createElement('p');p.textContent=c.name+' · '+(c.role==='owner'?'대표':c.role);$('companyList').append(p);}}
function signedOut(){token='';sessionStorage.removeItem(tokenKey);$('auth').classList.remove('hidden');$('dashboard').classList.add('hidden');}
$('loginTab').onclick=()=>mode(false);$('registerTab').onclick=()=>mode(true);
$('authForm').onsubmit=async e=>{e.preventDefault();const btn=$('authSubmit');btn.disabled=true;try{const data=await api(register?'/api/register':'/api/login','POST',{email:$('email').value,password:$('password').value,...(register?{name:$('name').value}:{})});token=data.token;sessionStorage.setItem(tokenKey,token);$('password').value='';await refresh();notify('로그인했습니다.');}catch(err){notify(err.message,true);}finally{btn.disabled=false;}};
$('workerForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/worker','PUT',{experience_months:Number($('experience').value)});await refresh();notify('작업자 정보가 저장되었습니다.');}catch(err){notify(err.message,true);}};
$('companyForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/companies','POST',{name:$('companyName').value});$('companyName').value='';await refresh();notify('업체가 등록되었습니다.');}catch(err){notify(err.message,true);}};
$('logout').onclick=async()=>{try{await api('/api/logout','POST');}catch{}signedOut();notify('로그아웃했습니다.');};
if(token)refresh().catch(()=>{signedOut();notify('로그인 세션이 만료되었습니다.',true);});
</script></body></html>
