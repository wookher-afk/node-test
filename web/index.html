<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NODE | 회원 및 프로필</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192a37;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:0 auto;padding:24px 18px 80px}h1{margin:12px 0 4px;font-size:30px;letter-spacing:-1px}h2{font-size:19px;margin:0 0 16px}p{color:#61707e;line-height:1.55}.panel{background:white;border:1px solid #e0e6eb;border-radius:16px;padding:22px;margin-top:18px;box-shadow:0 3px 12px #172b3d09}label{display:block;font-size:14px;font-weight:650;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5de;border-radius:10px;font-size:16px}button,.entry-choice{border:0;border-radius:10px;background:#1766cb;color:white;font-weight:700;padding:13px 16px;cursor:pointer;font-size:15px}button.secondary,.entry-choice{background:#eaf1fb;color:#1658a9}button.outline{background:white;border:1px solid #ccd5de;color:#35485a}button:disabled{opacity:.5;cursor:wait}.entry-choice{text-decoration:none;display:inline-block;overflow-wrap:anywhere}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none!important}.message{margin-top:14px;padding:12px;border-radius:9px;background:#eaf4ff;color:#144d82;font-size:14px}.message.error{background:#fff0ef;color:#a12323}.muted{font-size:13px}.tag{display:inline-block;background:#eef4fa;border-radius:999px;padding:5px 10px;font-size:13px;margin-right:5px}</style></head><body>
<main><h1>NODE</h1>
<section id="welcome" class="panel hidden"><p>건설 인력·장비 연결 플랫폼 노드에 오신 것을 환영합니다.</p><h2>해당 항목을 선택하세요.</h2><div class="actions"><a href="/?entry=company#auth" class="entry-choice" id="companyEntry">업체</a><a href="/?entry=worker#auth" class="entry-choice" id="workerEntry">작업자</a></div></section>
<section id="auth" class="panel hidden"><a href="/">처음으로</a><h2 id="authTitle">로그인</h2><div class="tabs"><button type="button" id="loginTab">로그인</button><button type="button" class="secondary" id="registerTab">회원가입</button></div>
<form id="authForm"><div id="nameRow" class="hidden"><label for="name">이름</label><input id="name" autocomplete="name" minlength="2" maxlength="80"></div>
<label for="email">이메일</label><input id="email" type="email" autocomplete="email" required>
<label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required minlength="10"><p class="muted" id="passwordHint">가입한 이메일과 비밀번호를 입력하세요.</p>
<div class="actions"><button type="submit" id="authSubmit">로그인</button></div></form></section>
<section id="dashboard" class="hidden"><div class="panel"><h2>내 계정</h2><div class="actions"><a class="entry-choice" href="#profile">정보수정</a><button type="button" id="matching">매칭확인</button></div><p id="matchingStatus" role="status" class="hidden">매칭확인 기능은 준비 중입니다.</p></div></section>
<section id="profile" class="hidden"><div class="panel"><a href="#main">메인으로</a><h2>정보수정</h2><div id="identity"></div><div id="roles" style="margin-top:12px"></div><div class="actions"><button type="button" class="outline" id="logout">로그아웃</button></div></div>
<div class="panel"><h2>작업자 프로필</h2><p><a href="/register/worker">작업자 등록 정보수정</a></p><p class="muted">작업자와 업체를 하나의 계정에서 함께 등록할 수 있습니다.</p><form id="workerForm"><label for="experience">경력 (개월)</label><input id="experience" type="number" min="0" max="900" step="1" required><div class="actions"><button type="submit">작업자 정보 저장</button></div></form></div>
<div class="panel"><h2>내 업체</h2><p><a class="entry-choice" href="/company-registration">업체 기본정보·현장·모집조건 등록/수정</a></p><div id="companyList"></div><form id="companyForm" tabindex="-1"><label for="companyName">신규 업체명</label><input id="companyName" minlength="2" maxlength="120" required><div class="actions"><button type="submit">업체 등록</button></div></form></div></section>
<div id="notice" role="status" aria-live="polite" class="hidden"></div>
</main><script>
const $=id=>document.getElementById(id);const requestedEntry=new URLSearchParams(location.search).get('entry');const entry=['company','worker','equipment'].includes(requestedEntry)?requestedEntry:null;let register=false;const tokenKey='node_auth_token';sessionStorage.removeItem(tokenKey);
function notify(message,error=false){$('notice').textContent=message;$('notice').className='message'+(error?' error':'');}
function mode(value){register=value;$('nameRow').classList.toggle('hidden',!value);$('name').required=value;$('password').autocomplete=value?'new-password':'current-password';$('authSubmit').textContent=value?'회원가입':'로그인';$('passwordHint').textContent=value?'비밀번호는 10자 이상 입력하세요.':'가입한 이메일과 비밀번호를 입력하세요.';$('loginTab').className=value?'secondary':'';$('registerTab').className=value?'':'secondary';}
async function api(path,method='GET',payload){const response=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Node-Session':'cookie'},...(payload?{body:JSON.stringify(payload)}:{})});let data;try{data=await response.json();}catch{throw Error('서버 응답을 읽을 수 없습니다.');}if(!response.ok)throw Object.assign(Error(data.error||'요청에 실패했습니다.'),{status:response.status});return data;}
async function refresh(){const d=await api('/api/me');show(location.hash==='#profile'?'profile':'dashboard');$('identity').textContent=d.account.display_name+' · '+d.account.email;$('roles').replaceChildren();for(const role of d.roles){const tag=document.createElement('span');tag.className='tag';tag.textContent=role==='worker'?'작업자':role==='company'?'업체':role;$('roles').append(tag);}$('experience').value=d.worker?.experience_months??0;$('companyList').replaceChildren();if(!d.companies.length){const p=document.createElement('p');p.className='muted';p.textContent='등록한 업체가 없습니다.';$('companyList').append(p);}for(const c of d.companies){const p=document.createElement('p');p.textContent=c.name+' · '+(c.role==='owner'?'대표':c.role);$('companyList').append(p);}}
let authenticated=false;
function show(id){for(const name of ['welcome','auth','dashboard','profile'])$(name).classList.toggle('hidden',name!==id);}
function signedOut(){authenticated=false;sessionStorage.removeItem(tokenKey);show(entry?'auth':'welcome');}
function afterLogin(wasRegister){authenticated=true;if(entry==='equipment')return location.assign('/worker-registration');if(wasRegister&&entry==='worker')return location.assign('/register/worker');if(wasRegister&&entry==='company'){return location.assign('/company-registration');}else{history.replaceState(null,'','/');show('dashboard');}}
window.addEventListener('hashchange',()=>{if(authenticated)show(location.hash==='#profile'?'profile':'dashboard');});
$('matching').onclick=()=>{$('matchingStatus').classList.remove('hidden');};
$('authTitle').textContent=entry==='company'?'업체 로그인 / 회원가입':'작업자 로그인 / 회원가입';
$('loginTab').onclick=()=>mode(false);$('registerTab').onclick=()=>mode(true);
$('authForm').onsubmit=async e=>{e.preventDefault();const btn=$('authSubmit');btn.disabled=true;try{const data=await api(register?'/api/register':'/api/login','POST',{email:$('email').value,password:$('password').value,...(register?{name:$('name').value}:{})});$('password').value='';await refresh();afterLogin(register);notify('로그인했습니다.');}catch(err){notify(err.message,true);}finally{btn.disabled=false;}};
$('workerForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/worker','PUT',{experience_months:Number($('experience').value)});await refresh();notify('작업자 정보가 저장되었습니다.');}catch(err){notify(err.message,true);}};
$('companyForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/companies','POST',{name:$('companyName').value});$('companyName').value='';await refresh();notify('업체가 등록되었습니다.');}catch(err){notify(err.message,true);}};
$('logout').onclick=async()=>{try{await api('/api/logout','POST');signedOut();history.replaceState(null,'','/');show('welcome');notify('로그아웃했습니다.');}catch(err){notify('로그아웃하지 못했습니다. 다시 시도하세요. '+err.message,true);}};
{notify('로그인 확인 중…');refresh().then(()=>{authenticated=true;$('notice').className='hidden';if(entry==='equipment')location.assign('/worker-registration');}).catch(err=>{if(err.status===401){signedOut();$('notice').className='hidden';}else{show(entry?'auth':'welcome');notify('서버에서 로그인 상태를 확인하지 못했습니다. 잠시 후 다시 시도하세요.',true);}});}
</script></body></html>
